info:
  name: product-create
  type: http
  seq: 8

http:
  method: POST
  url: http://127.0.0.1:8000/api/products
  body:
    type: multipart-form
    data:
      - name: category_id
        type: text
        value: "1"
      - name: name
        type: text
        value: IPhone 17 Pro Max
      - name: description
        type: text
        value: This is IPhone 17 Pro Max
      - name: price
        type: text
        value: "1499.50"
      - name: image_url
        type: file
        value:
          - /Users/yeekhinzaw/Downloads/iphone17.jpeg
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
